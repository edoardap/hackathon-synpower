# Politica estreita, usada SO pelo modo --command do secret-guard.
#
# Um glob por linha, em tres formas, escolhidas pela propria linha:
#
#   sem barra          casa contra o BASENAME do token          .env
#   terminada em barra casa contra qualquer COMPONENTE do caminho  .ssh/
#   com barra no meio  casa contra o CAMINHO COMPLETO do token  */proc/*/environ
#
# O prefixo ! marca excecao e vale para as tres formas. A ordem de leitura
# decide: a ultima linha que casa manda, entao excecao vem depois do padrao que
# ela abre.
#
# Um token que contem * ou ? e padrao escrito pelo chamador, nao caminho
# concreto, e nao e casado contra nenhuma linha desta politica. E o que faz
# `find . -name '*.pem'` e `find . -name '*.key'` serem trabalho legitimo.
#
# Ficam de fora de proposito: `.key` e `*.key`, por `jq '.key'`; `hosts.yml`,
# por `ansible-playbook -i hosts.yml site.yml`; e `environ` como basename, por
# `grep -rn environ src/` — o despejo de ambiente por /proc entra abaixo pela
# forma de caminho completo. A palavra nua `credentials` tambem nao casa, o que
# deixa ~/.aws/credentials coberto so pelo componente .aws.

.env
.env.*
!.env.example
!.env.sample
!.env.template

.netrc
.my-credentials-git
*.pem

id_rsa*
id_ed25519*
!id_rsa.pub
!id_ed25519.pub

# Carregador do .env: sourciado no Bash, entrega os tokens sem citar .env. Os
# tools que o usam seguem livres, porque o comando digitado e so `tools/<nome>`.
env.sh
carregar_env
resolver_token

# Despejo direto do ambiente de um processo, pelo caminho completo. O basename
# `environ` sozinho e ambiguo demais e nao entra.
*/proc/*/environ

# Diretorio de segredo por componente de caminho: pega `tar -czf x.tgz ~/.ssh`
# e `cp -r ~/.ssh /tmp/bkp`, que o basename sozinho perdia.
.ssh/
.aws/

# Nem tudo no ~/.ssh e segredo. Estas linhas vem depois de .ssh/ de proposito:
# a ultima linha que casa manda, entao a excecao precisa ser lida por ultimo.
!*/.ssh/config
!*/.ssh/known_hosts
!*/.ssh/authorized_keys
!*/.ssh/*.pub
