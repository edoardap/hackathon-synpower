# Um glob por linha. O casamento usa `case` do shell, onde * atravessa a barra,
# portanto ** e desnecessario. O prefixo ! marca excecao e e avaliado na ordem de leitura.
# O til e expandido para o diretorio do usuario.

.env
*/.env
.env.*
*/.env.*
!.env.example
!*/.env.example

*.pem
*.key
*/id_rsa*
*/id_ed25519*
.netrc
*/.netrc

~/.my-credentials-git
~/.config/gh/hosts.yml
~/.aws/credentials
~/.ssh/*

*/credentials
*/credentials.*
