# USD por 1 milhão de tokens, pela chave `gen_ai.request.model`. Modelo ausente fica sem `score.cost_usd` (D9).
# Os modelos do Codex não têm preço aqui:
# acrescente `[modelos."<id>"]` com `input` e `output` quando a tabela de preços deles estiver à mão.
# `cache_write` é a escrita de 5 minutos e `cache_read`, o acerto de cache. Conferido em
# https://platform.claude.com/docs/en/about-claude/pricing (2026-10-26). Sem a chave, o cache custa o preço de `input`.
# O Haiku 5.5 cobra $0,50 / $2,50 (entrada e saída) quando o prompt passa de 100 mil tokens; a tabela guarda só a faixa
# até 100 mil, então o `score.cost_usd` de uma chamada maior sai abaixo do custo real.

[modelos."claude-sonnet-5-5"]
input = 2.0
output = 10.0
cache_read = 0.1
cache_write = 2.5

[modelos."claude-opus-5-5"]
input = 4.0
output = 20.0
cache_read = 0.2
cache_write = 5.0

[modelos."claude-haiku-5-5"]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

[modelos."claude-fable-5-1"]
input = 10.0
output = 50.0
cache_read = 0.25
cache_write = 12.5
