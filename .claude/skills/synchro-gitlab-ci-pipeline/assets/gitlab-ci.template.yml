pytest:
  extends: .pytest-job

sonarqube:
  extends: .sonarqube-job

create-tag:
  extends: .create-tag-job

docker-build-dev:
  extends:
    - .docker-build-dev-job
  parallel:
    matrix:
      - NAME: <image-name>
        DOCKERFILE: "docker/<image-name>.Dockerfile"
        BUILD_CONTEXT: .
        DOCKER_BUILD_USE_GITLAB_TOKEN: "false"
      # - NAME: <another-image>
      #   DOCKERFILE: "docker/<another-image>.Dockerfile"
      #   BUILD_CONTEXT: .
      #   BUILD_TARGET: <target>            # somente para Dockerfiles multi-stage
      #   DOCKER_BUILD_USE_GITLAB_TOKEN: "false"

docker-build-release:
  extends:
    - .docker-build-release-job
  variables:
    TAG: "$CI_COMMIT_TAG"
  parallel:
    matrix:
      - NAME: <image-name>
        DOCKERFILE: "docker/<image-name>.Dockerfile"
        BUILD_CONTEXT: .
        DOCKER_BUILD_USE_GITLAB_TOKEN: "false"

generate-changelog:
  extends: .generate-changelog-job

create-release:
  extends: .create-release-job
  needs:
    - job: generate-changelog
      artifacts: true

