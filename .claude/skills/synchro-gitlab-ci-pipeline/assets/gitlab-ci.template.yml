# Ponto de partida para um novo pipeline Synchro / ia_produtos.
# Substitua todo <PLACEHOLDER>, apague as seções que não se aplicam a este projeto
# (veja o passo 2 do SKILL.md) e mantenha a ordem dos stages inalterada.
# Não copie para o arquivo final estes comentários de instrução nem adicione comentários de separação de seção;
# todo `echo` deve ter mensagem em português (veja "Regras Obrigatórias" no SKILL.md).

include:
  - component: $CI_SERVER_FQDN/devsecops/secret-detection/gitleaks@${SECRET_DETECTION_COMPONENT_VERSION}
  - component: $CI_SERVER_FQDN/devsecops/checkov-iac/checkov-iac@${CHECKOV_IAC_COMPONENT_VERSION}
  - component: $CI_SERVER_FQDN/devsecops/cdxgen/cdxgen@${CDXGEN_IAC_COMPONENT_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/renovate/renovate@${RENOVATE_COMPONENT_VERSION}
    inputs:
      stage: security
      renovate_config_path: renovate.json
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/python-qa/uv@${PYTHON_QA_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/python-qa/rules@${PYTHON_QA_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/python-qa/lint@${PYTHON_QA_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/python-qa/test@${PYTHON_QA_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/python-qa/import-linter@${PYTHON_QA_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/python-qa/uv-lock@${PYTHON_QA_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/python-qa/sonarqube@${PYTHON_QA_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/release/base-docker@${RELEASE_COMPONENT_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/release/docker-build@${RELEASE_COMPONENT_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/release/git-tag@${RELEASE_COMPONENT_VERSION}
  - component: $CI_SERVER_FQDN/ia_produtos/ci-catalog/release/release@${RELEASE_COMPONENT_VERSION}

stages:
  - security
  - code-checks
  - tests
  - sast
  # - ai-code-review   # descomente somente se este projeto adotou revisão de código automatizada por IA
  - tag
  - docker-build
  - release

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_PROJECT_ENVIRONMENT: "$CI_PROJECT_DIR/.venv"

.standard-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: never

.base-uv-image:
  image: astral/uv:python3.14-trixie-slim
  interruptible: true

.base-uv-full:
  extends: .base-uv-image
  before_script:
    - uv sync --locked --all-groups

.base-uv-tools:
  extends: .base-uv-image
  before_script:
    - uv sync --locked --no-default-groups --group lint

gitleaks:
  allow_failure: true

checkov:
  allow_failure: true

sbom:
  extends: .generate_source_sbom_template
  stage: security
  variables:
    CDXGEN_TARGET_DIRECTORY: "src"
    ENABLE_DEPENDENCY_TRACK: true
    DTRACK_PROJECT_GROUP: "IA Produtos"
    DTRACK_PROJECT_NAME: "<PROJECT_NAME>"
    DTRACK_PROJECT_VERSION: "$CI_COMMIT_REF_NAME"
    DTRACK_PROJECT_PARENT_NAME: "IA_Produtos"

renovate:
  extends: .renovate-job

validate-mr-title:
  stage: code-checks
  image: registry.synchro.com.br/library/alpine:latest
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  script:
    - |
      TITLE="${CI_MERGE_REQUEST_TITLE:-}"
      VALID_TAGS="Breaking|Feature|Fix|Refactor|Chore|Spike|Docs|Test"

      if [ -z "$TITLE" ]; then
        echo "❌ Erro: Título do Merge Request não encontrado (variável vazia)."
        exit 1
      fi

      if ! echo "$TITLE" | grep -Eq "^\[($VALID_TAGS)\] "; then
        echo "❌ Erro: O título do MR usa uma tag inválida ou ausente."
        echo "   Tags aceitas: $VALID_TAGS"
        echo "   Exemplo válido: [Feature] Adicionar endpoint de artifacts"
        exit 1
      fi

      if ! echo "$TITLE" | grep -Eq "^\[($VALID_TAGS)\] [A-Z]"; then
        echo "❌ Erro: A descrição do título deve começar com letra maiúscula."
        echo "   Exemplo válido: [Refactor] Ajustar validação do pipeline"
        echo "   Exemplo inválido: [Refactor] ajustar validação do pipeline"
        exit 1
      fi

      echo "✅ Título do MR validado com sucesso: $TITLE"

lint:
  extends: .lint-job

format:
  extends: .format-job

markdown-lint:
  extends: .markdown-lint-job

import-linter:
  extends: .import-linter-job

uv-lock-check:
  extends: .uv-lock-check-job

dockerfile-lint:
  extends: .dockerfile-lint-job
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - "docker/**/*.Dockerfile"
      when: on_success

