networks:
  __SERVICE__-network:
    name: __SERVICE__-prod-network
    external: true

services:
  grafana:
    container_name: __SERVICE__-grafana
    image: grafana/grafana:12.3
    ports:
      - ${GRAFANA_PORT}:3000
    volumes:
      - __SERVICE__-grafana-data:/var/lib/grafana
      - ./resources/observability/grafana.yml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    networks:
      - __SERVICE__-network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    container_name: __SERVICE__-prometheus
    image: prom/prometheus:v3.7.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - __SERVICE__-prometheus-data:/prometheus
      - ./resources/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose:
      - 9090
    networks:
      - __SERVICE__-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    container_name: __SERVICE__-loki
    image: grafana/loki:3.5.11
    user: root
    expose:
      - 3100
    command:
      - "-config.file=/etc/loki/config.yaml"
    volumes:
      - __SERVICE__-loki-data:/loki
      - ./resources/observability/loki.yml:/etc/loki/config.yaml:ro
    networks:
      - __SERVICE__-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  alloy:
    container_name: __SERVICE__-alloy
    image: grafana/alloy:v1.13.2
    command: run /etc/alloy/config.alloy
    ports:
      - "4318:4318"
      - "4317:4317"
    volumes:
      - ./resources/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - __SERVICE__-network
    restart: unless-stopped

  tempo:
    container_name: __SERVICE__-tempo
    image: grafana/tempo:latest
    command:
      - "-config.file=/etc/tempo.yaml"
    expose:
      - 3200
      - 4317
    volumes:
      - __SERVICE__-tempo-data:/tmp/tempo
      - ./resources/observability/tempo.yaml:/etc/tempo.yaml:ro
    networks:
      - __SERVICE__-network
    restart: unless-stopped

volumes:
  __SERVICE__-grafana-data:
  __SERVICE__-loki-data:
  __SERVICE__-prometheus-data:
  __SERVICE__-tempo-data:
