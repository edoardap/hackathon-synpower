# --- tests stage ---------------------------------------------------------------

pytest:
  extends: .pytest-job

sonarqube:
  extends: .sonarqube-job

# --- tag stage -------------------------------------------------------------------

create-tag:
  extends: .create-tag-job

# --- docker-build stage ------------------------------------------------------------

docker-build-dev:
  extends:
    - .docker-build-dev-job
  parallel:
    matrix:
      - NAME: <image-name>
        DOCKERFILE: "docker/<image-name>.Dockerfile"
        BUILD_CONTEXT: .
        DOCKER_BUILD_USE_GITLAB_TOKEN: "false"
      # - NAME: <another-image>
      #   DOCKERFILE: "docker/<another-image>.Dockerfile"
      #   BUILD_CONTEXT: .
      #   BUILD_TARGET: <target>            # only for multi-stage Dockerfiles
      #   DOCKER_BUILD_USE_GITLAB_TOKEN: "false"

docker-build-release:
  extends:
    - .docker-build-release-job
  variables:
    TAG: "$CI_COMMIT_TAG"
  parallel:
    matrix:
      - NAME: <image-name>
        DOCKERFILE: "docker/<image-name>.Dockerfile"
        BUILD_CONTEXT: .
        DOCKER_BUILD_USE_GITLAB_TOKEN: "false"

# --- release stage ---------------------------------------------------------------

generate-changelog:
  extends: .generate-changelog-job

create-release:
  extends: .create-release-job
  needs:
    - job: generate-changelog
      artifacts: true

